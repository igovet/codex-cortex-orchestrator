name: Cortex marketplace release gate

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: cortex-marketplace-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/cortex-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the sole Cortex marketplace release gate
        run: |
          python -B -W error::ResourceWarning - <<'PY'
          import runpy

          gate = runpy.run_path("tests/test_marketplace_release_gate.py")
          gate["test_cortex_plugin_is_publishable_and_operational"]()
          PY
