name: Cortex offline validation

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  # A newer push or PR update supersedes older evidence for the same ref.
  # Keep independent branches and pull requests running in parallel.
  group: cortex-offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    env:
      # The suite is deliberately self-contained: it needs only the Python
      # standard library and must not leave bytecode or test caches behind.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Keep set/dict iteration deterministic when the aggregate suite runs
      # across hosted runners; this makes order-sensitive regressions
      # reproducible from the same checked-out commit.
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate bundled plugin configuration
        run: |
          python -B scripts/validate-cortex-marketplace.py
      - name: Validate Python and shell syntax
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for path in sorted(Path('.').rglob('*.py')):
              if '.git' not in path.parts:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
          bash -n plugins/cortex/scripts/cortex-launcher scripts/sync-cortex.sh
          git diff --check
      - name: Run dispatch preflight and bounded-context regressions in isolation
        run: |
          python -B -W error::ResourceWarning -m unittest -v \
            tests.test_orchestration_dispatch_preflight.DispatchContextPreflightTests.test_advance_rejects_uncompilable_context_before_any_gate_or_attempt_mutation \
            tests.test_production_handoff_integration.ProductionHandoffIntegrationTests.test_c3_oversized_requirement_continues_after_completed_attempt_without_loss
      - name: Run the complete offline regression suite
        run: |
          python -B -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run cold boot, deterministic evaluation, and call-count benchmark
        run: |
          python -B scripts/cortex-cold-boot-smoke.py
          python -B scripts/cortex-luna-high-eval.py
          python -B scripts/cortex-composite-benchmark.py --workers 8 --waves 5 | tee /tmp/cortex-benchmark.json
          python -B - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/cortex-benchmark.json').read_text(encoding='utf-8'))
          if result.get('target_met') is not True:
              raise SystemExit('Cortex benchmark target was not met')
          PY
          python -B scripts/cortex-manifest-benchmark.py --files 50000 --max-seconds 30 | tee /tmp/cortex-manifest-benchmark.json
          python -B - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/cortex-manifest-benchmark.json').read_text(encoding='utf-8'))
          if result.get('target_met') is not True:
              raise SystemExit('Cortex manifest benchmark target was not met')
          PY
      - name: Probe fresh plugin registration when Codex CLI is available
        run: |
          if command -v codex >/dev/null 2>&1; then
            python -B scripts/probe-fresh-cortex-plugin.py
          else
            echo "Codex CLI unavailable; fresh-plugin evidence is not produced by this CI run."
          fi
      - name: Validate tracked release archive
        run: |
          python -B scripts/verify-cortex-release.py --require-tracked
      - name: Verify no bytecode or test cache artifacts
        run: |
          cache_paths="$(find . -path './.git' -prune -o \( -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -o -type f \( -name '*.pyc' -o -name '*.pyo' \) \) -print)"
          if [ -n "${cache_paths}" ]; then
            echo "Unexpected Python or test cache artifacts:"
            printf '%s\n' "${cache_paths}"
            exit 1
          fi
