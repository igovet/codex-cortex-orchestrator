name: cortex

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax checks
        run: |
          python -m py_compile plugins/cortex/scripts/cortex.py plugins/cortex/scripts/cortex_hook.py scripts/cortex-cold-boot-smoke.py scripts/cortex-luna-high-eval.py scripts/probe-fresh-cortex-plugin.py scripts/validate-cortex-marketplace.py scripts/verify-cortex-release.py tests/jsonrpc_harness.py
          bash -n scripts/sync-cortex.sh
          python scripts/validate-cortex-marketplace.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Diff hygiene
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --check "${base}...HEAD"
          else
            git diff --check
          fi
      - name: Clean-ledger smoke
        run: python3 scripts/cortex-cold-boot-smoke.py
      - name: Luna-high orchestration fixtures
        run: python3 scripts/cortex-luna-high-eval.py
      - name: Tracked release archive boundary
        run: python3 scripts/verify-cortex-release.py --require-tracked
      - name: Fresh Codex plugin registration
        run: python3 scripts/probe-fresh-cortex-plugin.py
      - name: Codex CLI availability
        run: |
          if command -v codex >/dev/null 2>&1; then
            codex --version
          else
            echo "Codex CLI unavailable; isolated plugin registration probe reports SKIP."
          fi
