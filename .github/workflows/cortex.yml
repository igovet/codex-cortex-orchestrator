name: Cortex offline validation

on:
  push:
  pull_request:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The suite is deliberately self-contained: it needs only the Python
      # standard library and must not leave bytecode or test caches behind.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bundled plugin configuration
        run: |
          python -B scripts/validate-cortex-marketplace.py
      - name: Run offline SQLite and projection regression suites
        run: |
          python -B -m unittest -v \
            tests.test_ledger_db \
            tests.test_projection_jobs \
            tests.test_delegation_projection \
            tests.test_lazy_filesystem \
            tests.test_legacy_lifecycle \
            tests.test_health_maintenance \
            tests.test_record_report_slice \
            tests.test_cortex_control \
            tests.test_cortex_invariants
      - name: Verify no bytecode or test cache artifacts
        run: |
          cache_paths="$(find . -path './.git' -prune -o \( -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -o -type f \( -name '*.pyc' -o -name '*.pyo' \) \) -print)"
          if [ -n "${cache_paths}" ]; then
            echo "Unexpected Python or test cache artifacts:"
            printf '%s\n' "${cache_paths}"
            exit 1
          fi
