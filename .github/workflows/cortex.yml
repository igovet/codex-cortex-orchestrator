name: Cortex marketplace release gate

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: cortex-marketplace-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/cortex-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the Cortex marketplace release gates
        run: |
          python -B scripts/cortex-prompt-lint.py
          python -B scripts/render_cortex_tool_catalog.py --check
          python -B scripts/validate-cortex-marketplace.py
          python -B scripts/verify-cortex-release.py --mode source
          python -B -m pytest -q tests/test_marketplace_release_gate.py
          git diff --check
