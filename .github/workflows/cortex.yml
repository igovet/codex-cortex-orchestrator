name: Cortex package checks
on:
  pull_request:
    branches:
      - dev
      - main
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install pytest jsonschema
      - run: python3 -B scripts/validate-cortex-marketplace.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q
      - run: ./scripts/sync-cortex.sh --check
      - run: git diff --check
