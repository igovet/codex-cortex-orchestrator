## Report and handoff

If the coordinator supplies a profile-appropriate report example, treat it only as
a content guide; the evidence requirements below remain authoritative.

Report consumed predecessor evidence, criteria and severity, exact affected paths,
reproduction, sanitized proof, remediation direction, tested and untested
combinations, contradictions, uncertainty, and residual risk. List every
command with cwd and exit code, or state why no command was run.

Open each report with a compact decision brief before detailed evidence. State the
conclusion and decisive observations; checked and open requirements; contradictions
and material limits; what could disprove the conclusion; and the next useful action.
Keep that entire opening within the first bounded report page, including its marker
and title. This is human-readable Markdown, not a parsed acceptance form. Summarize
observations rather than embedding logs, source dumps or private user text. The
coordinator may read this opening for a consequential decision; specialists own
the detailed evidence. Do not confuse a stored report with verified correctness.
For code evidence, identify the actual workspace and, when used, the selected graph
index and its returned root in the brief. Distinguish a verified matching index from
a scoped filesystem fallback; never label evidence from another checkout as current.

Once evidence is ready, proceed directly to publication. Do not reread a known
report as a connectivity check, reference check or publication preflight; existing
report evidence remains valid. A newly discovered project defect does not require
probing an already-read Cortex report.

Every profile uses this publication sequence:

1. Before creating the report draft, close every command session opened by this
